<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Story Card - Оаза Медика</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal: #2a7a7a;
      --white: #ffffff;
      --cream: #f9faf8;
      --text: #1c2a22;
      --text-mid: #3d5046;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: 'Lato', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
    }

    /* Автоматски се прилагодува на екранот без да бара скролање */
    .story-card {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      height: -webkit-fill-available;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 30px;
    }

    /* Замаглена и зумирана позадина */
    .story-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://www.oazamedika.com/blog/pictures-blog/lab.jpg') center center / cover no-repeat;
      transform: scale(1.3);
      filter: blur(25px) brightness(0.55);
      z-index: 1;
    }

    .story-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Подобрено Лого - Поголемо и повидливо */
    .logo-area {
      text-align: center;
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 10px;
      margin-bottom: 15px;
    }
    
    .logo-img {
      width: 85%;
      max-width: 280px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
    }

    /* Оптимизирана Централна Картичка */
    .main-card {
      background: rgba(249, 250, 248, 0.98);
      border-radius: 30px;
      padding: 25px 20px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Фиксна големина на малата слика */
    .card-image {
      width: 55%;
      max-width: 160px;
      height: auto;
      border-radius: 18px;
      display: block;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    /* Компактен Линк Индикатор */
    .link-placeholder {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 12px 0 18px 0;
    }

    .arrow-indicator {
      color: var(--teal);
      animation: bounce 1.5s infinite;
      margin-bottom: 2px;
      display: flex;
      justify-content: center;
    }

    .sticker-area {
      background: var(--white);
      padding: 12px 30px;
      border-radius: 50px;
      color: var(--teal);
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      box-shadow: 0 6px 15px rgba(42, 122, 122, 0.15);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(42, 122, 122, 0.08);
    }

    .tag {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--teal);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 12px;
      font-weight: 700;
      padding: 0 5px;
    }

    .intro-text {
      font-size: 1.05rem;
      color: var(--text-mid);
      line-height: 1.5;
      font-weight: 400;
      padding: 0 10px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  <div class="story-card">
    <div class="story-bg"></div>

    <div class="story-content">
      
      <!-- Поголема и јасна лого слика -->
      <div class="logo-area">
        <img src="https://raw.githubusercontent.com/oazamedika/oaza-medika-website/refs/heads/main/logo_header.png" alt="Оаза Медика" class="logo-img">
      </div>

      <!-- Централна картичка која сега ја собира целата содржина на еден екран -->
      <div class="main-card">
        <img src="https://www.oazamedika.com/blog/pictures-blog/lab.jpg" alt="Лабораторија" class="card-image">
        
        <div class="link-placeholder">
          <div class="arrow-indicator">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="sticker-area">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Отвори Напис
          </div>
        </div>

        <span class="tag">Превентивна Медицина</span>
        <h1>Како правилно да се подготвите за крвна слика?</h1>
        <p class="intro-text">
          Редовната лабораториска анализа е клуч за превенцијата. Дознајте зошто само „гладување наутро“ не е доволно и кои грешки најчесто ги правиме...
        </p>
      </div>

    </div>
  </div>

</body>
</html>
