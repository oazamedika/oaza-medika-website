<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Card - Оаза Медика</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal: #2a7a7a;
      --white: #ffffff;
      --cream: #f9faf8;
      --text: #1c2a22;
      --text-mid: #3d5046;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: 'Lato', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Фиксен 9:16 сооднос идеален за мобилен скриншот */
    .story-card {
      width: 1080px;
      height: 1920px;
      max-width: 100vw;
      max-height: calc(100vw * 1920 / 1080);
      aspect-ratio: 9 / 16;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 120px 60px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }

    /* Замаглена и зумирана позадина */
    .story-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://www.oazamedika.com/blog/pictures-blog/lab.jpg') center center / cover no-repeat;
      transform: scale(1.3);
      filter: blur(25px) brightness(0.65);
      z-index: 1;
    }

    /* Содржина над позадината */
    .story-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: space-between;
    }

    /* Лого Секција */
    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: var(--white);
      letter-spacing: 1px;
    }
    .logo-sub {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 5px;
    }

    /* Централна Картичка */
    .main-card {
      background: rgba(249, 250, 248, 0.96);
      border-radius: 30px;
      padding: 40px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    .card-image {
      width: 100%;
      height: auto;
      border-radius: 20px;
      margin-bottom: 35px;
      display: block;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .tag {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--teal);
      text-transform: uppercase;
      margin-bottom: 15px;
      display: block;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 25px;
    }

    .intro-text {
      font-size: 1.2rem;
      color: var(--text-mid);
      line-height: 1.7;
      font-weight: 300;
      padding: 0 10px;
    }

    /* Дно: Место за Линк Индикатор */
    .link-placeholder {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 5px;
    }

    /* Анимирани стрелки кои покажуваат каде ќе стои линкот */
    .arrow-indicator {
      color: var(--white);
      font-size: 2rem;
      animation: bounce 1.5s infinite;
      margin-bottom: 10px;
    }

    .sticker-area {
      border: 3px dashed rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      padding: 20px 50px;
      border-radius: 50px;
      color: var(--white);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="story-card">
    <!-- Зумирана позадина -->
    <div class="story-bg"></div>

    <!-- Главна содржина -->
    <div class="story-content">
      
      <!-- Лого дел на ординацијата -->
      <div class="logo-area">
        <div class="logo-text">Оаза Медика</div>
        <div class="logo-sub">ПЗУ Ординација</div>
      </div>

      <!-- Централен дел со чиста слика и кус текст -->
      <div class="main-card">
        <img src="https://www.oazamedika.com/blog/pictures-blog/lab.jpg" alt="Лабораторија" class="card-image">
        <span class="tag">Превентивна Медицина</span>
        <h1>Како правилно да се подготвите за крвна слика?</h1>
        <p class="intro-text">
          Редовната лабораториска анализа е клуч за превенцијата. Дознајте зошто само „гладување наутро“ не е доволно и кои грешки најчесто ги правиме...
        </p>
      </div>

      <!-- Место предвидено за Instagram Link Sticker -->
      <div class="link-placeholder">
        <div class="arrow-indicator">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="sticker-area">
          Ставете го линкот тука
        </div>
      </div>

    </div>
  </div>

</body>
</html>
