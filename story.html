<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Story Card - Оаза Медика</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal: #2a7a7a;
      --white: #ffffff;
      --text-dark: #1c2a22;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: 'Lato', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
    }

    .story-card {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      height: -webkit-fill-available;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 30px 40px 30px;
    }

    /* Светла, замаглена позадина без затемнување */
    .story-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://www.oazamedika.com/blog/pictures-blog/lab.jpg') center center / cover no-repeat;
      transform: scale(1.3);
      filter: blur(25px) brightness(1.0);
      z-index: 1;
    }

    .story-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Ново лого направено во чиста бела боја за подобар контраст */
    .logo-area {
      text-align: center;
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    
    .logo-img {
      width: 75%;
      max-width: 240px;
      height: auto;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    }

    /* Модерна Глоси Стаклена Картичка (Glassmorphism) */
    .main-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 30px;
      padding: 30px 25px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }

    /* Зголемена слика на артиклот */
    .card-image {
      width: 85%;
      max-width: 260px;
      height: auto;
      border-radius: 20px;
      display: block;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      margin-bottom: 25px;
    }

    .tag {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--white);
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: block;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: var(--white);
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      line-height: 1.3;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .intro-text {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
      line-height: 1.5;
      font-weight: 400;
      padding: 0 5px;
    }

    /* Дно: Линк Индикатор - Изваден целосно надвор под кутијата */
    .link-placeholder {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .arrow-indicator {
      color: var(--white);
      animation: bounce 1.5s infinite;
      margin-bottom: 4px;
      display: flex;
      justify-content: center;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
    }

    .sticker-area {
      background: var(--white);
      padding: 14px 35px;
      border-radius: 50px;
      color: var(--teal);
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <div class="story-card">
    <div class="story-bg"></div>

    <div class="story-content">
      
      <!-- Новото кратко лого (Бела верзија со висок контраст) -->
      <div class="logo-area">
        <img src="https://raw.githubusercontent.com/oazamedika/oaza-medika-website/refs/heads/main/logo_firma_kratoknaziv.png" alt="Оаза Медика" class="logo-img">
      </div>

      <!-- Централна Стаклена Картичка -->
      <div class="main-card">
        <!-- Зголемена слика -->
        <img src="https://www.oazamedika.com/blog/pictures-blog/lab.jpg" alt="Лабораторија" class="card-image">

        <span class="tag">Превентивна Медицина</span>
        <h1>Како правилно да се подготвите за крвна слика?</h1>
        <p class="intro-text">
          Редовната лабораториска анализа е клуч за превенцијата. Дознајте зошто само „гладување наутро“ не е доволно и кои грешки најчесто ги правиме...
        </p>
      </div>

      <!-- Стикер за Линк - Поставен ДИРЕКТНО под стаклениот елемент -->
      <div class="link-placeholder">
        <div class="arrow-indicator">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="sticker-area">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Отвори Напис
        </div>
      </div>

    </div>
  </div>

</body>
</html>
