<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Card - Оаза Медика</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal: #2a7a7a;
      --white: #ffffff;
      --cream: #f9faf8;
      --text: #1c2a22;
      --text-mid: #3d5046;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: 'Lato', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Фиксен 9:16 сооднос идеален за мобилен скриншот */
    .story-card {
      width: 1080px;
      height: 1920px;
      max-width: 100vw;
      max-height: calc(100vw * 1920 / 1080);
      aspect-ratio: 9 / 16;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 100px 50px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }

    /* Замаглена и зумирана позадина */
    .story-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://www.oazamedika.com/blog/pictures-blog/lab.jpg') center center / cover no-repeat;
      transform: scale(1.4);
      filter: blur(30px) brightness(0.6);
      z-index: 1;
    }

    /* Содржина над позадината */
    .story-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }

    /* Лого Секција со новата слика */
    .logo-area {
      text-align: center;
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    
    .logo-img {
      max-width: 480px;
      height: auto;
      object-fit: contain;
    }

    /* Централна Картичка */
    .main-card {
      background: rgba(249, 250, 248, 0.98);
      border-radius: 40px;
      padding: 50px 45px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Намалена слика на артиклот */
    .card-image {
      width: 60%;
      height: auto;
      border-radius: 25px;
      display: block;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    /* Дно: Место за Линк Индикатор - Сместено ДИРЕКТНО под сликата */
    .link-placeholder {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 25px 0 35px 0;
    }

    .arrow-indicator {
      color: var(--teal);
      font-size: 2rem;
      animation: bounce 1.5s infinite;
      margin-bottom: 5px;
      display: flex;
      justify-content: center;
    }

    /* Дизајн налик вистински Instagram Link Sticker */
    .sticker-area {
      background: var(--white);
      padding: 18px 45px;
      border-radius: 50px;
      color: var(--teal);
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(42, 122, 122, 0.15);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(42, 122, 122, 0.1);
    }

    /* Поголем и повидлив текст */
    .tag {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--teal);
      text-transform: uppercase;
      margin-bottom: 20px;
      display: block;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .intro-text {
      font-size: 1.5rem;
      color: var(--text-mid);
      line-height: 1.6;
      font-weight: 400;
      padding: 0 15px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <div class="story-card">
    <!-- Зумирана позадина -->
    <div class="story-bg"></div>

    <!-- Главна содржина -->
    <div class="story-content">
      
      <!-- Нова Лого слика на ординацијата -->
      <div class="logo-area">
        <img src="https://raw.githubusercontent.com/oazamedika/oaza-medika-website/refs/heads/main/logo_header.png" alt="Оаза Медика" class="logo-img">
      </div>

      <!-- Централен дел -->
      <div class="main-card">
        <!-- Намалена чиста слика -->
        <img src="https://www.oazamedika.com/blog/pictures-blog/lab.jpg" alt="Лабораторија" class="card-image">
        
        <!-- Место предвидено за Instagram Link Sticker (Веднаш под сликата) -->
        <div class="link-placeholder">
          <div class="arrow-indicator">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="sticker-area">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Отвори Линкиран Напис
          </div>
        </div>

        <!-- Поголем Текст под Стиверот -->
        <span class="tag">Превентивна Медицина</span>
        <h1>Како правилно да се подготвите за крвна слика?</h1>
        <p class="intro-text">
          Редовната лабораториска анализа е клуч за превенцијата. Дознајте зошто само „гладување наутро“ не е доволно и кои грешки најчесто ги правиме...
        </p>
      </div>

    </div>
  </div>

</body>
</html>
